====================================================================
  IONICA'S LEAGUE — LOCANDINA CLASSIFICA (A4 verticale, stampabile)
====================================================================

  COME SI USA
  -----------
  1) Apri questo file con un doppio clic (si apre nel browser:
     Chrome, Edge, Safari o Firefox). Non serve internet.

  2) Per inserire i dati hai DUE modi, scegli quello che preferisci:

     A) VELOCE — scrivi direttamente nelle celle:
        clic su una cella e digita. Va bene per riempirla al volo,
        ma quando chiudi la pagina i dati non vengono salvati.

     B) DEFINITIVO — modifica il blocco "CONFIG" che trovi in fondo
        a questo file (cerca "MODIFICA SOLO QUESTA PARTE").
        Apri il file con un editor di testo (Blocco note / TextEdit),
        scrivi i valori, salva e ricarica la pagina.
        Così i dati restano dentro il file.

  3) Per il PDF: premi il pulsante "Stampa / Salva in PDF"
     (oppure Ctrl+P / Cmd+P) e scegli come stampante
     "Salva come PDF". Impostazioni consigliate:
        - Formato: A4, orientamento verticale
        - Margini: nessuno
        - Grafica di sfondo: attiva (spunta "Grafica di sfondo")

  NOTE
  ----
  - DR (differenza reti) e Pti (punti) si calcolano da soli:
    DR = GF - GS, Pti = 3 per vittoria + 1 per pareggio.
    Se scrivi un valore a mano, quello scritto ha la precedenza.
  - Per cambiare il numero di righe usa "righe" nel blocco CONFIG.
====================================================================
-->

/* ============================================================
   PALETTE
   ============================================================ */
:root{
  --rosa:#ee4f8f; --rosa-scuro:#d9276f; --rosa-chiaro:#fbc4da; --rosa-linea:#f2a3c4;
  --blu:#1b8ce0; --blu-scuro:#0f5fa8; --navy:#134e7d; --blu-cielo:#2fa5e8;
  --oro:#f5c022; --oro-scuro:#dd8f08;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#20303c;
  font-family:'BalooL',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:18px 10px 40px;
}

/* ---------- barra strumenti (non stampata) ---------- */
.toolbar{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  margin-bottom:16px;
}
.toolbar button{
  font-family:'AntonL',sans-serif;font-size:15px;letter-spacing:.5px;
  background:var(--rosa);color:#fff;border:2px solid #fff;border-radius:999px;
  padding:9px 20px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.35);
}
.toolbar button:hover{background:var(--rosa-scuro)}
.toolbar .hint{color:#cfe3f0;font-size:13px;align-self:center;max-width:640px;text-align:center}

/* ============================================================
   LOCANDINA — formato A4 verticale
   ============================================================ */
.poster{
  position:relative;
  width:min(94vw,760px);
  aspect-ratio:210/297;
  container-type:size;
  overflow:hidden;
  box-shadow:0 14px 50px rgba(0,0,0,.55);
  background:#7ec8f0;
}
.poster>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- logo ---------- */
.logo{
  position:absolute;top:2.4cqh;left:50%;transform:translateX(-50%);
  width:47cqw;
}
.logo svg{width:100%;height:auto;display:block;
  filter:drop-shadow(0 .5cqw 1.1cqw rgba(0,50,90,.35))}

/* ---------- tabella ---------- */
.board{
  position:absolute;left:3.6cqw;right:3.6cqw;top:47.2cqh;
  background:#fff;
  border:.34cqw solid #8ed3f6;
  border-radius:3.1cqw;
  padding:.75cqw;
  box-shadow:0 .9cqw 2.2cqw rgba(0,55,105,.32);
}
.grid{border-radius:2.4cqw;overflow:hidden;background:#fff}
table{width:100%;border-collapse:collapse;table-layout:fixed}

thead th{
  background:linear-gradient(180deg,#f2609c 0%,#ec4488 55%,#e53b80 100%);
  color:#fff;
  font-family:'AntonL',sans-serif;font-weight:400;
  font-size:3.05cqw;letter-spacing:.06cqw;
  padding:1.15cqw 0 1.05cqw;
  text-transform:uppercase;
  text-shadow:0 .14cqw .18cqw rgba(150,10,60,.45);
  border:0;
}
thead th.pos{font-size:2.9cqw}
thead th.squadra{font-size:3.15cqw}

tbody td{
  border:.14cqw solid var(--rosa-linea);
  height:6.7cqh;
  background:rgba(255,255,255,.94);
  font-family:'AntonL',sans-serif;
  font-size:3.2cqw;color:var(--blu-scuro);
  text-align:center;vertical-align:middle;
  padding:0 .2cqw;
  overflow:hidden;white-space:nowrap;
}
tbody tr:nth-child(even) td{background:rgba(245,249,251,.94)}
tbody td:first-child{border-left:0}
tbody td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}

td.pos{
  font-family:'BalooL',sans-serif;font-weight:800;
  font-size:3.5cqw;color:var(--blu);
  transform:skewX(-11deg);
  text-align:center;
}
td.squadra{
  font-family:'BalooL',sans-serif;font-weight:800;
  font-size:2.9cqw;color:var(--navy);
  text-align:left;padding-left:1.4cqw;padding-right:.9cqw;letter-spacing:-.02cqw;
}
td.pti{color:var(--rosa-scuro)}
td.dr{color:#0f6fb8}

/* celle modificabili direttamente nel browser */
[contenteditable]{outline:0}
[contenteditable]:focus{background:#fff9c4 !important;box-shadow:inset 0 0 0 .2cqw #f3c000}

/* ============================================================
   STAMPA / PDF  →  A4 senza margini
   ============================================================ */
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff;padding:0;display:block}
  .toolbar{display:none !important}
  .poster{
    width:210mm;height:297mm;aspect-ratio:auto;
    box-shadow:none;margin:0;
    break-inside:avoid;page-break-inside:avoid;
  }
  html,body,.poster{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<script>
/* ==================================================================
   ▼▼▼  MODIFICA SOLO QUESTA PARTE  ▼▼▼
   ------------------------------------------------------------------
   nome = nome squadra   PG = partite giocate   V = vinte
   P = pareggiate        S = perse              GF = gol fatti
   GS = gol subiti       DR = differenza reti   Pti = punti

   Se "autoCalcolo" è true, DR e Pti vengono calcolati da soli
   (DR = GF - GS, Pti = 3·V + 1·P). Lascia "" per cella vuota.
   ================================================================== */
const CONFIG = {
  righe: 5,               // quante righe stampare
  autoCalcolo: true,      // calcola DR e Pti automaticamente
  ordinaPerPunti: false,  // true = riordina la classifica dai punti più alti
  puntiVittoria: 3,
  puntiPareggio: 1,
  puntiSconfitta: 0,

  squadre: [
    { nome:"", pg:"", v:"", p:"", s:"", gf:"", gs:"", dr:"", pti:"" },
    { nome:"", pg:"", v:"", p:"", s:"", gf:"", gs:"", dr:"", pti:"" },
    { nome:"", pg:"", v:"", p:"", s:"", gf:"", gs:"", dr:"", pti:"" },
    { nome:"", pg:"", v:"", p:"", s:"", gf:"", gs:"", dr:"", pti:"" },
    { nome:"", pg:"", v:"", p:"", s:"", gf:"", gs:"", dr:"", pti:"" }
  ]
};
/* ▲▲▲  FINE PARTE DA MODIFICARE  ▲▲▲ */


/* ==================================================================
   Rendering tabella
   ================================================================== */
const num = v => (v === "" || v === null || v === undefined) ? null : Number(v);

function calcola(r){
  const o = Object.assign({nome:"",pg:"",v:"",p:"",s:"",gf:"",gs:"",dr:"",pti:""}, r);
  if(!CONFIG.autoCalcolo) return o;
  const gf = num(o.gf), gs = num(o.gs), v = num(o.v), p = num(o.p), s = num(o.s);
  if(o.dr === "" && gf !== null && gs !== null){
    const d = gf - gs;
    o.dr = d > 0 ? "+" + d : String(d);
  }
  if(o.pti === "" && v !== null){
    o.pti = v*CONFIG.puntiVittoria + (p||0)*CONFIG.puntiPareggio + (s||0)*CONFIG.puntiSconfitta;
  }
  if(o.pg === "" && v !== null && p !== null && s !== null) o.pg = v + p + s;
  return o;
}

function render(){
  let righe = (CONFIG.squadre || []).map(calcola);

  if(CONFIG.ordinaPerPunti){
    const n = v => { const x = num(v); return x === null ? -1e9 : x; };
    righe.sort((a,b) => n(b.pti) - n(a.pti)
                     || n(String(b.dr).replace("+","")) - n(String(a.dr).replace("+",""))
                     || n(b.gf) - n(a.gf));
  }
  while(righe.length < CONFIG.righe) righe.push(calcola({}));
  righe = righe.slice(0, CONFIG.righe);

  const corpo = document.getElementById("corpo");
  corpo.innerHTML = righe.map((r,i) => `
    <tr>
      <td class="pos">${i+1}.</td>
      <td class="squadra" contenteditable="true">${r.nome}</td>
      <td contenteditable="true">${r.pg}</td>
      <td contenteditable="true">${r.v}</td>
      <td contenteditable="true">${r.p}</td>
      <td contenteditable="true">${r.s}</td>
      <td contenteditable="true">${r.gf}</td>
      <td contenteditable="true">${r.gs}</td>
      <td class="dr" contenteditable="true">${r.dr}</td>
      <td class="pti" contenteditable="true">${r.pti}</td>
    </tr>`).join("");
}

/* i nomi lunghi vengono rimpiccioliti quel tanto che basta per entrare */
function adattaNomi(){
  document.querySelectorAll("#corpo td.squadra").forEach(td => {
    let s = 2.9;
    td.style.fontSize = s + "cqw";
    let giri = 0;
    while(td.scrollWidth > td.clientWidth + 1 && s > 1.45 && giri++ < 40){
      s -= .07;
      td.style.fontSize = s.toFixed(2) + "cqw";
    }
  });
}

function svuota(){
  document.querySelectorAll("#corpo td[contenteditable]").forEach(td => td.textContent = "");
  adattaNomi();
}

/* ==================================================================
   Decorazioni dello sfondo (generate una volta, sempre identiche)
   ================================================================== */
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
// generatore pseudo-casuale deterministico (stessa grafica a schermo e in stampa)
let seme = 20250808;
function rnd(){ seme = (seme*1103515245 + 12345) & 0x7fffffff; return seme / 0x7fffffff; }

/* --- nuvole --- */
function nuvola(g, x, y, s){
  const parti = [[0,0,58,26],[42,-10,44,22],[-40,-6,40,20],[80,6,34,16],[-76,8,30,15]];
  parti.forEach(([dx,dy,rx,ry]) => g.appendChild(
    el("ellipse",{cx:x+dx*s, cy:y+dy*s, rx:rx*s, ry:ry*s, "fill-opacity":.97})));
}
(function(){
  const g = document.getElementById("nuvole");
  [[150,470,1.05],[420,438,1.25],[700,462,1.1],[930,420,.95],[560,514,.8],[260,520,.7],[820,516,.75]]
    .forEach(([x,y,s]) => nuvola(g,x,y,s));
})();

/* --- granelli di sabbia --- */
(function(){
  const g = document.getElementById("granelli");
  for(let i=0;i<420;i++){
    const y = 950 + rnd()*480;
    g.appendChild(el("circle",{cx:rnd()*1075, cy:y, r:1+rnd()*2.4}));
  }
})();

/* --- schizzi magenta/ciano + retini agli angoli --- */
(function(){
  const g = document.getElementById("schizzi");
  const angoli = [
    {x:0,   y:0,    sx: 1, sy: 1},
    {x:1075,y:0,    sx:-1, sy: 1},
    {x:0,   y:1435, sx: 1, sy:-1},
    {x:1075,y:1435, sx:-1, sy:-1}
  ];
  angoli.forEach((a,idx) => {
    const gg = el("g",{transform:`translate(${a.x},${a.y}) scale(${a.sx},${a.sy})`,
                       mask:"url(#mAngolo)"});
    // ciuffi di pennellate corte, come le spruzzate magenta dell'originale
    const colori = ["#ff2f86","#ff5fa2","#e0157a","#12a5ef"];
    for(let i=0;i<26;i++){
      const l  = 34 + rnd()*105;
      const x0 = 4 + rnd()*180, y0 = 4 + rnd()*210;
      const ang = -20 - rnd()*60;
      const c = colori[i % 7 === 6 ? 3 : i % 3];
      gg.appendChild(el("path",{
        d:`M${x0} ${y0} q${Math.cos(ang*Math.PI/180)*l*.55} ${-Math.sin(ang*Math.PI/180)*l*.4} `
          +`${Math.cos(ang*Math.PI/180)*l} ${-Math.sin(ang*Math.PI/180)*l}`,
        stroke:c, "stroke-width": 2.5 + rnd()*9,
        "stroke-linecap":"round", "stroke-opacity": .5 + rnd()*.45, fill:"none"
      }));
    }
    // retino di puntini sfumato
    gg.appendChild(el("rect",{x:0,y:0,width:250,height:270,
      fill:`url(#${idx%2 ? "pDotsBlu" : "pDotsRosa"})`, opacity:.45}));
    g.appendChild(gg);
  });
  // retino leggero sul mare, sfumato verso il centro
  g.appendChild(el("rect",{x:0,y:600,width:260,height:320,fill:"url(#pDotsBlu)",
    opacity:.3, mask:"url(#mMareSx)"}));
  g.appendChild(el("rect",{x:815,y:600,width:260,height:320,fill:"url(#pDotsRosa)",
    opacity:.28, mask:"url(#mMareDx)"}));
})();

/* --- palme e foglie tropicali --- */
function puntoQ(p0,p1,p2,t){
  const u = 1-t;
  return [u*u*p0[0] + 2*u*t*p1[0] + t*t*p2[0],
          u*u*p0[1] + 2*u*t*p1[1] + t*t*p2[1]];
}
function fronda(g, {x,y,rot=0, len=300, larg=70, colore="url(#gFoglia)", n=22, sc=1, opac=1}){
  const gg = el("g",{transform:`translate(${x},${y}) rotate(${rot}) scale(${sc})`,
                     opacity:opac});
  const p0=[0,0], p1=[len*.55,-larg*.55], p2=[len,larg*.25];
  // rachide
  let d = `M0 0 Q ${p1[0]} ${p1[1]} ${p2[0]} ${p2[1]}`;
  for(let i=1;i<=n;i++){
    const t = i/(n+1);
    const [px,py] = puntoQ(p0,p1,p2,t);
    const [qx,qy] = puntoQ(p0,p1,p2,Math.min(1,t+.02));
    const dx = qx-px, dy = qy-py, m = Math.hypot(dx,dy)||1;
    const nx = -dy/m, ny = dx/m;
    const L = larg*(0.45 + 0.95*Math.sin(Math.PI*Math.pow(t,.85)));
    [1,-1].forEach(s => {
      const tipx = px + nx*L*s + dx/m*L*.55;
      const tipy = py + ny*L*s + dy/m*L*.55;
      const cx = px + nx*L*s*.45 + dx/m*L*.15;
      const cy = py + ny*L*s*.45 + dy/m*L*.15;
      gg.appendChild(el("path",{
        d:`M${px} ${py} Q ${cx} ${cy} ${tipx} ${tipy} Q ${px+dx/m*10} ${py+dy/m*10} ${px} ${py} Z`,
        fill: colore, "fill-opacity": s>0 ? .95 : .8
      }));
    });
  }
  gg.appendChild(el("path",{d, fill:"none", stroke:"#1d6b1b", "stroke-width":5, "stroke-linecap":"round"}));
  g.appendChild(gg);
}
function foglia(g, {x,y,rot=0,len=200,larg=58,colore="#e0157a",opac=1,sc=1}){
  const gg = el("g",{transform:`translate(${x},${y}) rotate(${rot}) scale(${sc})`, opacity:opac});
  gg.appendChild(el("path",{
    d:`M0 0 C ${len*.3} ${-larg} ${len*.75} ${-larg} ${len} 0 C ${len*.75} ${larg} ${len*.3} ${larg} 0 0 Z`,
    fill:colore}));
  gg.appendChild(el("path",{d:`M0 0 L ${len} 0`, stroke:"#ffffff", "stroke-opacity":.35, "stroke-width":3}));
  for(let i=1;i<7;i++){
    const t=i/7;
    gg.appendChild(el("path",{d:`M${len*t} 0 l ${len*.1} ${-larg*.72*(1-Math.abs(.5-t))}`,
      stroke:"#ffffff","stroke-opacity":.22,"stroke-width":2.5,fill:"none"}));
    gg.appendChild(el("path",{d:`M${len*t} 0 l ${len*.1} ${larg*.72*(1-Math.abs(.5-t))}`,
      stroke:"#ffffff","stroke-opacity":.22,"stroke-width":2.5,fill:"none"}));
  }
  g.appendChild(gg);
}
